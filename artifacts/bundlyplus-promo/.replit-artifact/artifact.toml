kind = "video"
previewPath = "/bundlyplus-promo/"
title = "BundlyPlus Promo Video"
version = "1.0.0"
id = "artifacts/bundlyplus-promo"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/bundlyplus-promo/" ]
localPort = 24776

[services.development]
run = "pnpm --filter @workspace/bundlyplus-promo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bundlyplus-promo", "run", "build" ]
publicDir = "artifacts/bundlyplus-promo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24776"
BASE_PATH = "/bundlyplus-promo/"
